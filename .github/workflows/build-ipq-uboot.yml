# Read-only build verification for the Xiaomi BE10000 (ipq9574) U-Boot.
#
# One job: strict host regressions -> in-tree ./build.sh of the single
# BE10000 defconfig with a pinned toolchain and the rename-gzip web
# profile -> offline candidate check -> one Actions artifact holding the
# MBN, manifest, SHA256SUMS and check result. No Release is created or
# deleted here; a green run is a static build candidate, not a device
# qualification. See doc/rc01-ci.md.

name: BE10000 U-Boot candidate

on:
  push:
    branches: [be10000-four-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash    # bash -eo pipefail

jobs:
  be10000:
    name: ipq9574_xiaomi_be10000
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DEFCONFIG: ipq9574_xiaomi_be10000_defconfig
      CANDIDATE: bin/openwrt-ipq9574_xiaomi_be10000-u-boot.mbn
      TOOLCHAIN_REPO: https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git
      TOOLCHAIN_COMMIT: 0daf0879219130c46812cd5029fbcc2940316b16
      TOOLCHAIN_BIN: ../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin
      NODE_VERSION: 24.22.2
      UV_VERSION: 0.13.5
      UV_PYTHON: python3            # the runner's system Python 3, no download
      UV_PYTHON_DOWNLOADS: never
      RC01_CI_STRICT: '1'           # missing baseline / sanitizer fallback = failure
      RC01_WEB_PROFILE: rename-gzip # class rename + gzip, no minifier/zopfli discovery
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout (full history for regression baselines)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install host packages
        run: |
          echo "OUT=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"
          OUT=$RUNNER_TEMP/ci-out
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev gawk gettext libssl-dev python3 \
            cpio flex bison bc device-tree-compiler
          mkdir -p "$OUT/logs"
          {
            uname -m; . /etc/os-release; echo "$PRETTY_NAME"
            echo "runner-image ${ImageOS:-?} ${ImageVersion:-?}"
            uv --version; uv run --offline --no-project env PATH="$PATH" python3 --version
            node --version; cc --version | sed -n 1p; dtc --version; git --version
          } | tee "$OUT/logs/host-tools.txt"
          test "$(uname -m)" = x86_64
          test "$(node --version)" = "v$NODE_VERSION"

      - name: Check regression baselines are reachable
        run: |
          revs=$(grep -ho 'BASELINE_REV = "[0-9a-f]\{40\}"' test/rc01/test_*.py | cut -d'"' -f2 | sort -u)
          test -n "$revs"
          for rev in $revs; do
            git cat-file -e "$rev^{commit}" || { echo "::error::baseline $rev not in checkout"; exit 1; }
          done
          echo "$revs" | paste -sd, - > "$OUT/baselines.txt"
          cat "$OUT/baselines.txt"

      - name: Host regressions (strict)
        run: |
          for t in test_nand_write_safety test_upgrade_results test_env_save \
                   test_ci_failures test_ci_candidate; do
            echo "::group::$t"
            uv run --offline --no-project env PATH="$PATH" python3 -B "test/rc01/$t.py" 2>&1 | tee "$OUT/logs/$t.log"
            echo "::endgroup::"
          done

      - name: Fetch pinned toolchain
        run: |
          git init -q ../staging_dir
          git -C ../staging_dir fetch -q --depth=1 "$TOOLCHAIN_REPO" "$TOOLCHAIN_COMMIT"
          git -C ../staging_dir checkout -q --detach FETCH_HEAD
          test "$(git -C ../staging_dir rev-parse HEAD)" = "$TOOLCHAIN_COMMIT"
          "$TOOLCHAIN_BIN/arm-openwrt-linux-gcc" --version | sed -n 1p | tee "$OUT/gcc-version.txt"
          "$TOOLCHAIN_BIN/arm-openwrt-linux-strip" --version | sed -n 1p

      - name: Build ${{ env.DEFCONFIG }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "$SOURCE_DATE_EPOCH" > "$OUT/source-date-epoch.txt"
          ./build.sh "$DEFCONFIG" 2>&1 | tee "$OUT/logs/build.log"
          test -s "$CANDIDATE"

      - name: Check candidate
        run: |
          # uv prepends the selected Python directory to PATH. Preserve the
          # setup-node PATH so /usr/bin/node cannot replace the pinned Node.
          uv run --offline --no-project env PATH="$PATH" python3 -B tools/ci/check_be10000_candidate.py \
            --tree . --mbn "$CANDIDATE" \
            --result "$OUT/check-result.json" --candidate-dir "$OUT/candidate" \
            --meta "source_sha=$(git rev-parse HEAD)" \
            --meta "ref=$GITHUB_REF" \
            --meta "event=$GITHUB_EVENT_NAME" \
            --meta "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --meta "public_four_port_base=54a2eb299d190abfabca58fe061bd7dcaa2e6c19" \
            --meta "regression_baselines=$(cat "$OUT/baselines.txt")" \
            --meta "defconfig=$DEFCONFIG" \
            --meta "toolchain_repo=$TOOLCHAIN_REPO" \
            --meta "toolchain_commit=$TOOLCHAIN_COMMIT" \
            --meta "gcc=$(cat "$OUT/gcc-version.txt")" \
            --meta "uv=$(uv --version)" \
            --meta "web_profile=$RC01_WEB_PROFILE" \
            --meta "source_date_epoch=$(cat "$OUT/source-date-epoch.txt")" \
            --meta "runner=ubuntu-24.04 ${ImageVersion:-?} $(uname -m)" \
            --meta "host_regressions=strict pass" \
            2>&1 | tee "$OUT/logs/check.log"
          uv run --offline --no-project env PATH="$PATH" python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["OUT"]) / "candidate/manifest.json").read_text())
          assert manifest["tools"]["node"] == "v" + os.environ["NODE_VERSION"], manifest["tools"]
          PY
          cd "$OUT/candidate" && sha256sum -c SHA256SUMS

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: be10000-uboot-candidate-${{ github.sha }}
          path: ${{ env.OUT }}/candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics (failed run, not a candidate)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: be10000-uboot-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT }}/logs/
            ${{ env.OUT }}/check-result.json
            .config
            u-boot.cfg
          if-no-files-found: warn
          retention-days: 7
